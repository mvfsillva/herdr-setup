onboarding = false

[keys]

# ────────────────────────────────────────
# PANES
# ────────────────────────────────────────

# Move o foco entre panes
focus_pane_left = "ctrl+alt+cmd+shift+h"
focus_pane_down = "ctrl+alt+cmd+shift+j"
focus_pane_up = "ctrl+alt+cmd+shift+k"
focus_pane_right = "ctrl+alt+cmd+shift+l"

# Cria panes
split_vertical = "ctrl+alt+cmd+shift+v"
split_horizontal = "ctrl+alt+cmd+shift+s"

# Fecha, expande e redimensiona panes
close_pane = "ctrl+alt+cmd+shift+x"
zoom = "ctrl+alt+cmd+shift+z"
resize_pane_left = "ctrl+alt+cmd+shift+left"
resize_pane_down = "ctrl+alt+cmd+shift+down"
resize_pane_up = "ctrl+alt+cmd+shift+up"
resize_pane_right = "ctrl+alt+cmd+shift+right"

# ────────────────────────────────────────
# TABS
# ────────────────────────────────────────

new_tab = "ctrl+alt+cmd+shift+t"
previous_tab = "ctrl+alt+cmd+shift+["
next_tab = "ctrl+alt+cmd+shift+]"
close_tab = "ctrl+alt+cmd+shift+q"
rename_tab = "ctrl+alt+cmd+shift+r"

# ────────────────────────────────────────
# WORKSPACES
# ────────────────────────────────────────

# O seletor de workspaces fica desativado por enquanto
# workspace_picker = "ctrl+alt+cmd+shift+y"

new_workspace = "ctrl+alt+cmd+shift+n"
previous_workspace = "ctrl+alt+cmd+shift+comma"
next_workspace = "ctrl+alt+cmd+shift+."
goto = "ctrl+alt+cmd+shift+d"
new_worktree = "ctrl+alt+cmd+shift+w"

# ────────────────────────────────────────
# UI
# ────────────────────────────────────────

# Caps+B controla a sidebar nativa do Herdr
toggle_sidebar = "ctrl+alt+cmd+shift+b"

settings = "ctrl+alt+cmd+shift+o"
help = "ctrl+alt+cmd+shift+/"

# Caps+I recarrega este arquivo
reload_config = "ctrl+alt+cmd+shift+i"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
sidebar_width = 64
sidebar_min_width = 42
sidebar_max_width = 82
prompt_new_workspace_name = true
agent_panel_sort = "spaces"

# ────────────────────────────────────────
# CLAUTH
# ────────────────────────────────────────

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "clauth.open"
description = "clauth accounts"

# ────────────────────────────────────────
# HERDR HARPOON
# ────────────────────────────────────────

# Caps+M marca o pane atual
[[keys.command]]
key = "ctrl+alt+cmd+shift+m"
type = "plugin_action"
command = "herdr-harpoon.add"
description = "harpoon: marcar pane"

# Caps+0 abre o seletor
[[keys.command]]
key = "ctrl+alt+cmd+shift+0"
type = "plugin_action"
command = "herdr-harpoon.pick"
description = "harpoon: selecionar pane"

[[keys.command]]
key = "ctrl+alt+cmd+shift+1"
type = "plugin_action"
command = "herdr-harpoon.jump1"
description = "harpoon: pane 1"

[[keys.command]]
key = "ctrl+alt+cmd+shift+2"
type = "plugin_action"
command = "herdr-harpoon.jump2"
description = "harpoon: pane 2"

[[keys.command]]
key = "ctrl+alt+cmd+shift+3"
type = "plugin_action"
command = "herdr-harpoon.jump3"
description = "harpoon: pane 3"

[[keys.command]]
key = "ctrl+alt+cmd+shift+4"
type = "plugin_action"
command = "herdr-harpoon.jump4"
description = "harpoon: pane 4"

[[keys.command]]
key = "ctrl+alt+cmd+shift+5"
type = "plugin_action"
command = "herdr-harpoon.jump5"
description = "harpoon: pane 5"

[[keys.command]]
key = "ctrl+alt+cmd+shift+6"
type = "plugin_action"
command = "herdr-harpoon.jump6"
description = "harpoon: pane 6"

[[keys.command]]
key = "ctrl+alt+cmd+shift+7"
type = "plugin_action"
command = "herdr-harpoon.jump7"
description = "harpoon: pane 7"

[[keys.command]]
key = "ctrl+alt+cmd+shift+8"
type = "plugin_action"
command = "herdr-harpoon.jump8"
description = "harpoon: pane 8"

[[keys.command]]
key = "ctrl+alt+cmd+shift+9"
type = "plugin_action"
command = "herdr-harpoon.jump9"
description = "harpoon: pane 9"

# ────────────────────────────────────────
# HERDR SIDEBAR
# ────────────────────────────────────────

# Caps+E abre o Explorer
[[keys.command]]
key = "ctrl+alt+cmd+shift+e"
type = "plugin_action"
command = "herdr-sidebar.show-explorer"
description = "sidebar: explorer"

# Caps+F abre a busca
[[keys.command]]
key = "ctrl+alt+cmd+shift+f"
type = "plugin_action"
command = "herdr-sidebar.show-search"
description = "sidebar: search"

# Caps+C abre o Source Control do plugin
[[keys.command]]
key = "ctrl+alt+cmd+shift+c"
type = "plugin_action"
command = "herdr-sidebar.show-git"
description = "sidebar: source control"

# Caps+P abre o seletor rápido de arquivos
[[keys.command]]
key = "ctrl+alt+cmd+shift+p"
type = "plugin_action"
command = "herdr-sidebar.quick-open"
description = "sidebar: quick open"

# O toggle do plugin permanece separado da sidebar nativa
[[keys.command]]
key = "prefix+b"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "sidebar plugin: toggle"

# ────────────────────────────────────────
# FERRAMENTAS RÁPIDAS
# ────────────────────────────────────────

# Caps+U abre um terminal temporário no diretório do pane atual
[[keys.command]]
key = "ctrl+alt+cmd+shift+u"
type = "popup"
command = "exec \"${SHELL:-/bin/zsh}\" -l"
description = "terminal rápido"
width = "30%"
height = "20%"

# Caps+G abre o LazyGit no repositório do pane atual
[[keys.command]]
key = "ctrl+alt+cmd+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "95%"
height = "90%"

# Abre projeto no Zed 
[[keys.command]]
key = "ctrl+alt+cmd+shift+enter"
type = "shell"
command = "open -a \"Zed\" \"$HERDR_ACTIVE_PANE_CWD\""
description = "abrir projeto no Zed"
